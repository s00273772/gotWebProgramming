<div class="form">
    <h2>Search Character</h2>
        <!--When submitted getCharacter() method is triggered-->
        <div>
            <div class="form-group">
                <!--
                I used this page to help me create a dropdown menu: 
                https://v17.angular.io/guide/forms 
                -->
                <label for="option">Search by</label>
                <select class="form-control" [(ngModel)]="opt" name="option" required>
                    <option *ngFor="let opt of options" [value]="opt">{{opt}}</option>
                </select>
                <form (ngSubmit)="get(name, opt)">
                <label for="name">Search</label>
                <input  class="form-control" type="text" [(ngModel)]="name" id="name" name="name">
                <!--I need to reset the page number whenever a new search is made-->
                <div class="buttonsDiv">
                     <button class="btn btn-primary custom-btn" (click)="resetPageNumber()" type="submit">Search</button>
                </div>
            </form>
        </div>
    </div>
</div>
